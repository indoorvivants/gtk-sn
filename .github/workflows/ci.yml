name: CI
on:
  push:
    branches: ["main"]
  pull_request:
  release:
    types: ["published"]

env:
  JAVA_OPTS: -Xmx6G

jobs:
  build:
    name: CI
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: coursier/cache-action@v6

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: SBT remote cache
        id: remote-cache
        uses: actions/cache@v3
        with:
          path: ./.remote-cache
          key: ${{ runner.os }}-remote-cache

      - name: Pull cache
        run: sbt --client pullRemoteCache || echo 'remote cache not found'

      - name: Regenerate XSD schema
        run: sbt --client generateIntrospectionSchema && git diff --exit-code

      - name: Regenerate fluent bindings
        run: sbt --client generateFluentBindings && git diff --exit-code

      - name: Check generatedReport is up-to-date
        run: sbt --client generateReport && git diff --exit-code

      - name: apt-get update
        run: sudo apt-get update

      - name: Install GTK
        run: sudo apt-get install
          libgtk-4-dev
          libadwaita-1-dev
          libgirepository1.0-dev

      - name: Compile
        run: sbt --client Test/compile

      - name: Test
        run: sbt --client test

      - name: Publish locally
        run: sbt --client publishLocal

      - name: Build binary
        run: sbt --client examples/nativeLink

      - name: Build website
        run: sbt --client buildWebsite

      - name: Publish gh-pages
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: Push cache
        run: sbt --client pushRemoteCache || echo 'oh well then'

      - name: Publish ${{ github.ref }}
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: sbt ci-release # sbt --client won't pick up the env variables from the block below
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  gen-check:
    name: Generator infrastructure
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: coursier/cache-action@v6

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: apt-get update
        run: sudo apt-get update

      - name: Install GTK
        run: sudo apt-get install
          libgtk-4-dev
          libadwaita-1-dev
          libgirepository1.0-dev

      - name: Check site builds
        run: sbt --client buildWebsite

  publish-site:
    name: Publish site
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: coursier/cache-action@v6

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

  mergify-build-checkpoint:
    runs-on: ubuntu-24.04
    needs: [build, gen-check]
    steps:
      - name: I only exist to please Mergify :(
        run: echo "It's a sad existence but necessary"
